name: CI

on:
  push:
    branches: [main]
    paths:
      - "**/package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "**/package-lock.json"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Run extension tests
        run: |
          for t in tests/test-*.mjs; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done