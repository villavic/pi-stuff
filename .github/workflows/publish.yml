name: Publish

on:
  push:
    tags:
      - "v*"
    paths:
      - "extensions/pi-prompt-rewriter/**"
      - "extensions/no-heredoc/**"
  workflow_dispatch:
    inputs:
      extension:
        description: "Extension directory name to publish (e.g. pi-prompt-rewriter). Leave empty for all."
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extension:
          - pi-prompt-rewriter
          - no-heredoc
    defaults:
      run:
        working-directory: extensions/${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: extensions/${{ matrix.extension }}/package-lock.json
      - run: npm ci

      - name: Publish
        run: npm stage publish --provenance --access public