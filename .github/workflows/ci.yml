name: CI

on:
  push:
    branches: [main]
    paths:
      - "**/package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "**/package-lock.json"
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Install extension dependencies
        run: |
          for dir in extensions/*/; do
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && npm ci)
            fi
          done
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Install extension dependencies
        run: |
          for dir in extensions/*/; do
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && npm ci)
            fi
          done
      - name: Run extension tests
        run: |
          for t in tests/test-*.mjs; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done